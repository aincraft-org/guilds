name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build:
    permissions:
      contents: read
      packages: read
      actions: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4.4.4
      - name: Set up Java 26
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "26"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4.4.4
      - name: Build and verify
        env:
          MINT_PACKAGES_ACTOR: ${{ secrets.MINT_PACKAGES_ACTOR || github.actor }}
          MINT_PACKAGES_TOKEN: ${{ secrets.MINT_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew --no-daemon build
      - name: Upload analysis reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-reports
          path: |
            **/build/reports/pmd/**
            **/build/reports/checkstyle/**
            **/build/reports/spotbugs/**
          retention-days: 1
          if-no-files-found: ignore
