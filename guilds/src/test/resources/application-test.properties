# Test Database Configuration
test.datasource.driver-class-name=org.h2.Driver
test.datasource.url=jdbc:h2:mem:towny_test;DB_CLOSE_DELAY=-1;MODE=MySQL
test.datasource.username=sa
test.datasource.password=
test.datasource.hikari.maximum-pool-size=5
test.datasource.hikari.minimum-idle=1
test.datasource.hikari.idle-timeout=30000
test.datasource.hikari.pool-name=TestHikariPool

# Test Plugin Configuration
test.plugin.name=Towny
test.plugin.version=1.0.0-SNAPSHOT
test.plugin.author=TestAuthor
test.plugin.database-prefix=towny_test_

# MockBukkit Configuration
test.mockbukkit.world-name=test_world
test.mockbukkit.world-environment=NORMAL
test.mockbukkit.world-seed=12345L
test.mockbukkit.player-name=TestPlayer
test.mockbukkit.player-op=false

# Test Data Configuration
test.town.default-name=TestTown
test.town.default-mayor=TestMayor
test.town.default-residents=5
test.plot.default-price=1000.0
test.plot.default-x=10
test.plot.default-z=20
test.plot.default-world=test_world

# Test Logging Configuration
test.logging.level.root=WARN
test.logging.level.org.aincraft.towny=DEBUG
test.logging.level.org.hibernate=ERROR
test.logging.level.org.springframework=ERROR

# Test Performance Configuration
test.test.timeout.seconds=30
test.database.connection.timeout.milliseconds=5000
test.mock.initialization.timeout.milliseconds=3000

# Test Security Configuration
test.encryption.key=test-encryption-key-32-chars
test.jwt.secret=test-jwt-secret-key-64-characters-long-enough-for-hs256-algorithm
test.session.timeout=3600

# Test Integration Configuration
test.integration.enabled=false
test.integration.database.cleanup=true
test.integration.mock.external.services=true

# Test Coverage Configuration
test.coverage.minimum.lines=80
test.coverage.minimum.branches=70
test.coverage.excluded.classes=**/*Test*,**/Test*

# Test Output Configuration
test.output.directory=build/test-results
test.output.include-exceptions=true
test.output.include-system-out=true
test.output.include-system-err=true