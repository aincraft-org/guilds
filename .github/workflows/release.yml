name: Create Stable Release

on:
  workflow_dispatch:
    inputs:
      stable_version:
        description: "Immutable stable CalVer: YY.M.D.run"
        required: true
        type: string

permissions: {}

concurrency:
  group: territories-stable-${{ inputs.stable_version }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify and create stable release
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check out development-network harness
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: aincraft-org/plugin-multiplexer
          ref: bcb260ad245afb37000ca5003b856ac854e9c68a # main
          path: plugin-multiplexer
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Java 26
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Validate stable version and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STABLE_VERSION: ${{ inputs.stable_version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_RUN_ATTEMPT}" != "1" ]]; then
            echo "Stable releases are immutable. Start a new workflow run instead of rerunning this one." >&2
            exit 1
          fi
          if [[ ! "${STABLE_VERSION}" =~ ^[0-9]{2}\.(1[0-2]|[1-9])\.(3[01]|[12][0-9]|[1-9])\.[1-9][0-9]*$ ]]; then
            echo "Invalid stable version: ${STABLE_VERSION}" >&2
            exit 1
          fi
          tag="v${STABLE_VERSION}"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists; refusing to overwrite it." >&2
            exit 1
          fi

      - name: Build stable plugin JARs
        env:
          MINT_PACKAGES_ACTOR: ${{ secrets.MINT_PACKAGES_ACTOR || github.actor }}
          MINT_PACKAGES_TOKEN: ${{ secrets.MINT_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          STABLE_VERSION: ${{ inputs.stable_version }}
        run: ./gradlew --no-daemon clean test build -PreleaseVersion="${STABLE_VERSION}"

      - name: Verify and checksum stable assets
        env:
          STABLE_VERSION: ${{ inputs.stable_version }}
        run: |
          set -euo pipefail
          plugin="guilds-paper/build/libs/guilds-${STABLE_VERSION}.jar"
          sources="guilds-paper/build/libs/guilds-${STABLE_VERSION}-sources.jar"
          test -s "${plugin}"
          test -s "${sources}"
          sha256sum "${plugin}" > "${plugin}.sha256"
          sha256sum "${sources}" > "${sources}.sha256"

      - name: Create stable GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STABLE_VERSION: ${{ inputs.stable_version }}
        run: |
          set -euo pipefail
          plugin="guilds-paper/build/libs/guilds-${STABLE_VERSION}.jar"
          sources="guilds-paper/build/libs/guilds-${STABLE_VERSION}-sources.jar"
          notes="$(mktemp)"
          trap 'rm -f "${notes}"' EXIT
          cat > "${notes}" <<NOTES
          ## Guilds ${STABLE_VERSION}

          Stable release built from commit \`${GITHUB_SHA}\`.

          SHA-256 checksum files are attached for both JARs.
          NOTES
          sed -i 's/^[[:space:]]*//' "${notes}"
          gh release create "v${STABLE_VERSION}" \
            "${plugin}" "${plugin}.sha256" \
            "${sources}" "${sources}.sha256" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Guilds ${STABLE_VERSION}" \
            --notes-file "${notes}" \
            --latest