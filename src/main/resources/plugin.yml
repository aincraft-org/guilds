name: Towny
version: 1.0.0
main: org.aincraft.towny.TownyPlugin
api-version: 1.21
author: Aincraft
description: Enhanced town and nation management plugin
website: https://github.com/aincraft/towny

depend: []
softdepend: [Vault, WorldEdit, WorldGuard]

# Command registrations are handled by Brigadier dynamically
# No command definitions needed here - Brigadier manages registration

permissions:
  towny.*:
    description: All Towny permissions
    children:
      towny.town.*: true
      towny.resident.*: true
      towny.plot.*: true
      towny.general.*: true
      towny.map: true
      towny.admin.*: true

  towny.town.*:
    description: All town-related permissions
    children:
      towny.town.create: true
      towny.town.delete: true
      towny.town.join: true
      towny.town.leave: true
      towny.town.claim: true
      towny.town.unclaim: true
      towny.town.spawn: true
      towny.town.set: true
      towny.town.kick: true
      towny.town.invite: true
      towny.town.mayor: true
      towny.town.assistant: true

  towny.resident.*:
    description: All resident-related permissions
    children:
      towny.resident.info: true
      towny.resident.list: true
      towny.resident.friend: true
      towny.resident.town: true

  towny.plot.*:
    description: All plot-related permissions
    children:
      towny.plot.claim: true
      towny.plot.unclaim: true
      towny.plot.info: true
      towny.plot.set: true
      towny.plot.perms: true
      towny.plot.toggle: true

  towny.broadcast:
    description: Permission to use town broadcast commands
    default: true

  towny.broadcast.*:
    description: All broadcast permissions
    children:
      towny.broadcast.create: true
      towny.broadcast.read: true
      towny.broadcast.manage: true

  towny.general.*:
    description: General towny permissions
    children:
      towny.general.info: true
      towny.general.chat: true
      towny.general.top: true
      towny.general.prices: true
      towny.general.time: true
      towny.general.universe: true
      towny.general.version: true

  towny.chat:
    description: Permission to use town chat commands
    default: true

  towny.map:
    description: Permission to use towny map commands
    default: true

  towny.level:
    description: Permission to use town level commands
    default: true

  towny.admin.perm:
    description: Permission to use permission debugging commands
    default: op

  towny.admin.*:
    description: All admin permissions
    children:
      towny.admin.reload: true
      towny.admin.backup: true
      towny.admin.purge: true
      towny.admin.town: true
      towny.admin.resident: true
      towny.admin.plot: true
      towny.admin.plottype: true
      towny.admin.unclaim: true
      towny.admin.claim: true
      towny.admin.bypass: true

  towny.admin.plottype:
    description: Permission to use plot type management commands
    default: op