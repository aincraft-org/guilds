<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Azoth Territory Map</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="bar">
    <div class="brand">Azoth Territory</div>
    <div class="meta" id="meta">loading…</div>
    <div class="controls">
      <label>World <input id="world" value="world" size="10" /></label>
      <button id="refresh" type="button">Refresh</button>
      <span id="hover" class="hover">—</span>
    </div>
  </header>
  <main>
    <aside id="list" class="list"></aside>
    <section class="map-wrap">
      <canvas id="map" width="900" height="700"></canvas>
      <p class="hint">Click map to resolve zone · scroll to zoom · drag to pan</p>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
