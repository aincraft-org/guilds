name: Nightly Release

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: territories-nightly-${{ github.ref }}
  cancel-in-progress: false

env:
  API_ROOT: https://api.github.com

jobs:
  build:
    permissions:
      contents: read
      packages: read
      actions: write
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Set up Java 26
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "26"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Calculate and validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(date -u +'%y.%-m.%-d').${GITHUB_RUN_NUMBER}"
          if [[ ! "$version" =~ ^[0-9]{2}\.(1[0-2]|[1-9])\.(3[01]|[12][0-9]|[1-9])\.[1-9][0-9]*$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and verify
        env:
          MINT_PACKAGES_ACTOR: ${{ secrets.MINT_PACKAGES_ACTOR || 'mintychochip' }}
          MINT_PACKAGES_TOKEN: ${{ secrets.MINT_PACKAGES_TOKEN }}
        run: ./gradlew --no-daemon -PreleaseVersion="$RELEASE_VERSION" clean test build

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -f "paper/build/libs/azoth-territory-${RELEASE_VERSION}.jar"
          test -f "paper/build/libs/azoth-territory-${RELEASE_VERSION}-sources.jar"

      - name: Compute artifact checksums
        shell: bash
        run: |
          set -euo pipefail
          for artifact in \
            "paper/build/libs/azoth-territory-${RELEASE_VERSION}.jar" \
            "paper/build/libs/azoth-territory-${RELEASE_VERSION}-sources.jar"; do
            sha256sum "$artifact" > "$artifact.sha256"
          done

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nightly-${{ env.RELEASE_VERSION }}
          path: |
            paper/build/libs/azoth-territory-${{ env.RELEASE_VERSION }}.jar
            paper/build/libs/azoth-territory-${{ env.RELEASE_VERSION }}-sources.jar
            paper/build/libs/*.sha256
          retention-days: 1
          if-no-files-found: error

  release:
    needs: build
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          name: nightly-${{ needs.build.outputs.version }}
          path: paper/build/libs
      - name: Create or update rolling nightly release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          repo_url="${API_ROOT}/repos/${REPOSITORY}"
          release_json="$(mktemp)"
          update_json="$(mktemp)"
          trap 'rm -f "$release_json" "$update_json"' EXIT

          release_status="$(curl --silent --show-error --output "$release_json" --write-out '%{http_code}' "${auth[@]}" "${repo_url}/releases/tags/nightly")"
          if [[ "$release_status" == "200" ]]; then
            release_id="$(jq -r '.id' "$release_json")"
          elif [[ "$release_status" == "404" ]]; then
            release_id=""
          else
            cat "$release_json"
            exit 1
          fi

          if [[ -n "$release_id" ]]; then
            jq -c '.assets[] | {id,name}' "$release_json" | while IFS= read -r asset; do
              asset_id="$(jq -r '.id' <<<"$asset")"
              curl --fail-with-body --silent --show-error -X DELETE "${auth[@]}" "${repo_url}/releases/assets/${asset_id}"
            done
            jq -n \
              --arg name "Nightly ${RELEASE_VERSION}" \
              --arg target "$COMMIT_SHA" \
              --arg body "Automated nightly build.\n\nCommit: ${COMMIT_SHA}\nWorkflow run: ${RUN_URL}" \
              '{tag_name:"nightly",target_commitish:$target,name:$name,body:$body,draft:false,prerelease:true,make_latest:"false"}' > "$update_json"
            curl --fail-with-body --silent --show-error -X PATCH "${auth[@]}" -H 'Content-Type: application/json' \
              "${repo_url}/releases/${release_id}" --data-binary "@${update_json}" > "$release_json"
          else
            jq -n \
              --arg tag "nightly" \
              --arg target "$COMMIT_SHA" \
              --arg name "Nightly ${RELEASE_VERSION}" \
              --arg body "Automated nightly build.\n\nCommit: ${COMMIT_SHA}\nWorkflow run: ${RUN_URL}" \
              '{tag_name:$tag,target_commitish:$target,name:$name,body:$body,draft:false,prerelease:true,make_latest:"false"}' > "$update_json"
            curl --fail-with-body --silent --show-error -X POST "${auth[@]}" -H 'Content-Type: application/json' \
              "${repo_url}/releases" --data-binary "@${update_json}" > "$release_json"
            release_id="$(jq -r '.id' "$release_json")"
          fi
          tag_ref="${repo_url}/git/refs/tags/nightly"
          tag_status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "${auth[@]}" "$tag_ref")"
          if [[ "$tag_status" == "200" ]]; then
            jq -n --arg sha "$COMMIT_SHA" '{sha:$sha,force:true}' > "$update_json"
            curl --fail-with-body --silent --show-error -X PATCH "${auth[@]}" -H 'Content-Type: application/json' \
              "$tag_ref" --data-binary "@${update_json}" > /dev/null
          elif [[ "$tag_status" == "404" ]]; then
            jq -n --arg ref "refs/tags/nightly" --arg sha "$COMMIT_SHA" '{ref:$ref,sha:$sha}' > "$update_json"
            curl --fail-with-body --silent --show-error -X POST "${auth[@]}" -H 'Content-Type: application/json' \
              "${repo_url}/git/refs" --data-binary "@${update_json}" > /dev/null
          else
            exit 1
          fi

          upload_url="$(jq -r '.upload_url' "$release_json" | sed 's/{?name,label}//')"
          test -n "$upload_url"
          for artifact in \
            "paper/build/libs/azoth-territory-${RELEASE_VERSION}.jar" \
            "paper/build/libs/azoth-territory-${RELEASE_VERSION}-sources.jar" \
            "paper/build/libs/azoth-territory-${RELEASE_VERSION}.jar.sha256" \
            "paper/build/libs/azoth-territory-${RELEASE_VERSION}-sources.jar.sha256"; do
            curl --fail-with-body --silent --show-error -X POST "${auth[@]}" \
              -H 'Content-Type: application/java-archive' \
              "${upload_url}?name=$(basename "$artifact")" --data-binary "@$artifact" > /dev/null
          done
          tag_state="$(curl --fail-with-body --silent --show-error "${auth[@]}" "$tag_ref")"
          test "$(jq -r '.object.sha' <<<"$tag_state")" = "$COMMIT_SHA"

      - name: Verify nightly release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          nightly="$(curl --fail-with-body --silent --show-error "${auth[@]}" "${API_ROOT}/repos/${REPOSITORY}/releases/tags/nightly")"
          test "$(jq -r '.tag_name' <<<"$nightly")" = nightly
          test "$(jq -r '.draft' <<<"$nightly")" = false
          test "$(jq -r '.prerelease' <<<"$nightly")" = true
          jq -e --arg version "$RELEASE_VERSION" '.assets | map(.name) | index(("azoth-territory-" + $version + ".jar")) != null' <<<"$nightly" > /dev/null
          jq -e --arg version "$RELEASE_VERSION" '.assets | map(.name) | index(("azoth-territory-" + $version + "-sources.jar")) != null' <<<"$nightly" > /dev/null
          jq -e --arg version "$RELEASE_VERSION" '.assets | map(.name) | index(("azoth-territory-" + $version + ".jar.sha256")) != null' <<<"$nightly" > /dev/null
          jq -e --arg version "$RELEASE_VERSION" '.assets | map(.name) | index(("azoth-territory-" + $version + "-sources.jar.sha256")) != null' <<<"$nightly" > /dev/null
