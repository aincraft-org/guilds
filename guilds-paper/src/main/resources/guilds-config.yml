# Guilds Plugin Configuration
# This file contains default settings for the Guilds plugin
guild_bank:
  capacity_per_level: 1000.00
  capacity_scale: 2
  operation_timeout_ms: 5000

# Personal fast-travel currency defaults. Values are global and player-bound.
travel-currency:
  starter: 10
  maximum: 1000
  base-cost: 1
  distance-divisor: 100.0
  mode-multipliers:
    WAYSTONE: 1.0
    CRYSTAL: 1.0
    BOAT: 1.25
    AIRSHIP: 1.5
  reservation-duration-millis: 30000
  rewards:
    QUEST_COMPLETION: 20
    EXPLORATION_MILESTONE: 10
    GUILD_ACTIVITY: 5

# General Settings
language: en
debug: false

# Guild Settings
guild:
  default_tax: 0.0
  max_name_length: 20
  min_name_length: 3
  max_residents: 50
  creation_cost: 0.0
  deletion_refund: 0.0

# Plot Settings
plot:
  size: 16
  claim_cost: 0.0
  unclaim_refund: 0.0

# Permission Settings
permissions:
  default_build: false
  default_destroy: false
  default_switch: false
  default_item_use: false

# Database Settings
database:
  auto_backup: true
  backup_interval: 3600

# Message Settings
messages:
  prefix: "&6[Guilds]&r "
  success_color: "&a"
  error_color: "&c"
  info_color: "&e"

# Economic Settings
economy:
  enabled: false
  starting_balance: 100.0
  daily_upkeep: true
  upkeep_cost: 10.0

# Hearthstone teleport settings
hearthstone:
  item: "ENDER_PEARL"
  cooldown-seconds: 30

# Guild Level System Configuration
guild_levels:
  max_level: 150
  levels:
    2:
      requirements:
        EXPERIENCE: 50
      benefits:
        tech_points: 1
        claim_limit_bonus: 2
        assistant_slots_bonus: 0
        daily_income_bonus: 0.5
        unlocked_plot_types: []
    3:
      requirements:
        EXPERIENCE: 75
      benefits:
        tech_points: 1
        claim_limit_bonus: 2
        assistant_slots_bonus: 0
        daily_income_bonus: 0.5
        unlocked_plot_types: []
    4:
      requirements:
        EXPERIENCE: 100
      benefits:
        tech_points: 1
        claim_limit_bonus: 2
        assistant_slots_bonus: 0
        daily_income_bonus: 0.5
        unlocked_plot_types: []
    5:
      requirements:
        EXPERIENCE: 150
      benefits:
        tech_points: 1
        claim_limit_bonus: 2
        assistant_slots_bonus: 0
        daily_income_bonus: 0.5
        unlocked_plot_types: []
    10:
      requirements:
        EXPERIENCE: 400
      benefits:
        tech_points: 1
        claim_limit_bonus: 2
        assistant_slots_bonus: 1
        daily_income_bonus: 0.5
        unlocked_plot_types: ["BANK"]
