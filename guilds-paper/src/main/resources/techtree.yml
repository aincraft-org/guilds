# Tech Tree Configuration
# Each node has: name, description, branch, cost, prerequisites, effects, position-x, position-y
# Branches: INFRASTRUCTURE, DEFENSE, COMMERCE, CULTURE
# Position is for the GUI layout (0-indexed, 9 columns per row)

nodes:
  # ── INFRASTRUCTURE (row 1) ──
  better_storage:
    name: "Better Storage"
    description: "Increases guild bank capacity by 50%"
    branch: INFRASTRUCTURE
    cost: 2
    prerequisites: []
    effects:
      income_bonus: 0.5
    position-x: 1
    position-y: 0

  fast_travel:
    name: "Fast Travel"
    description: "Reduces teleport cooldown to guild spawn by 50%"
    branch: INFRASTRUCTURE
    cost: 3
    parent: better_storage
    prerequisites: [better_storage]
    effects:
      teleport_cooldown_reduction: 0.5
    position-x: 1
    position-y: 1

  advanced_farming:
    name: "Advanced Farming"
    description: "Farm plots within guild produce 25% more crops"
    branch: INFRASTRUCTURE
    cost: 3
    parent: better_storage
    prerequisites: [better_storage]
    effects:
      farm_yield_bonus: 0.25
    position-x: 2
    position-y: 1

  auto_sorter:
    name: "Auto Sorter"
    description: "Unlocks automatic chest sorting in guild plots"
    branch: INFRASTRUCTURE
    cost: 5
    parent: fast_travel
    prerequisites: [fast_travel, advanced_farming]
    effects:
      auto_sort: true
    position-x: 1
    position-y: 2

  # ── DEFENSE (row 2) ──
  reinforced_walls:
    name: "Reinforced Walls"
    description: "Enemy TNT damage reduced by 25% in guild"
    branch: DEFENSE
    cost: 2
    prerequisites: []
    effects:
      explosion_damage_reduction: 0.25
    position-x: 4
    position-y: 0

  guard_posts:
    name: "Guard Posts"
    description: "Guild border alerts for non-residents"
    branch: DEFENSE
    cost: 3
    parent: reinforced_walls
    prerequisites: [reinforced_walls]
    effects:
      border_alerts: true
    position-x: 4
    position-y: 1

  siege_shields:
    name: "Siege Shields"
    description: "Guild is immune to siege for 1 hour after being attacked"
    branch: DEFENSE
    cost: 4
    parent: guard_posts
    prerequisites: [guard_posts]
    effects:
      siege_immunity_minutes: 60
    position-x: 4
    position-y: 2

  fortification:
    name: "Fortification"
    description: "All defense bonuses doubled while at war"
    branch: DEFENSE
    cost: 6
    parent: siege_shields
    prerequisites: [siege_shields]
    effects:
      war_defense_bonus: 2.0
    position-x: 4
    position-y: 3

  # ── COMMERCE (row 3) ──
  marketplace:
    name: "Marketplace"
    description: "Shop plots have 10% lower transaction fees"
    branch: COMMERCE
    cost: 2
    prerequisites: []
    effects:
      shop_fee_reduction: 0.1
    position-x: 5
    position-y: 0

  trade_routes:
    name: "Trade Routes"
    description: "Daily guild income increased by 15%"
    branch: COMMERCE
    cost: 3
    parent: marketplace
    prerequisites: [marketplace]
    effects:
      income_bonus: 0.15
    position-x: 6
    position-y: 0

  tax_optimization:
    name: "Tax Optimization"
    description: "Guild collects 10% more from resident taxes"
    branch: COMMERCE
    cost: 4
    parent: trade_routes
    prerequisites: [trade_routes]
    effects:
      tax_bonus: 0.1
    position-x: 6
    position-y: 1

  merchant_guild:
    name: "Merchant Guild"
    description: "Residents can set up NPC merchants in shop plots"
    branch: COMMERCE
    cost: 6
    parent: tax_optimization
    prerequisites: [tax_optimization]
    effects:
      npc_merchants: true
      income_bonus: 0.2
    position-x: 6
    position-y: 2

  # ── CULTURE (row 4) ──
  guild_banner:
    name: "Guild Banner"
    description: "Customizable guild banner displayed at spawn"
    branch: CULTURE
    cost: 1
    prerequisites: []
    effects:
      custom_banner: true
    position-x: 7
    position-y: 0

  broadcast_tower:
    name: "Broadcast Tower"
    description: "Guild-wide announcements reach all residents instantly"
    branch: CULTURE
    cost: 3
    parent: guild_banner
    prerequisites: [guild_banner]
    effects:
      broadcast_range: "global"
    position-x: 7
    position-y: 1

  guild_hall:
    name: "Guild Hall"
    description: "Unlocks guild hall plot type with meeting room features"
    branch: CULTURE
    cost: 4
    parent: broadcast_tower
    prerequisites: [broadcast_tower]
    effects:
      guild_hall: true
    position-x: 7
    position-y: 2

  monument:
    name: "Monument"
    description: "Grants +2 claim limit and boosts resident morale"
    branch: CULTURE
    cost: 6
    parent: guild_hall
    prerequisites: [guild_hall]
    effects:
      extra_claims: 2
      morale_bonus: true
    position-x: 7
    position-y: 3
