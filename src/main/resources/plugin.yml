name: AzothTerritory
version: ${version}
main: com.azoth.territory.AzothTerritoryPlugin
api-version: '1.21'
description: ${description}
author: Azoth
website: https://github.com/azoth/azoth-territory
load: POSTWORLD
softdepend: [Vault, WorldEdit, WorldGuard, triumph-gui]
commands:
  territory:
    description: Inspect territory and zone at a location
    usage: /territory [lookup|list|reload]
    permission: azoth.territory.admin
    aliases: [azterritory, at]
# Guilds commands are registered dynamically via Paper Brigadier lifecycle
permissions:
  azoth.territory.admin:
    description: Administer and inspect territories
    default: op

  guilds.*:
    description: All Guilds permissions
    children:
      guilds.town.*: true
      guilds.resident.*: true
      guilds.plot.*: true
      guilds.general.*: true
      guilds.map: true
      guilds.admin.*: true
      guilds.nation.*: true
      guilds.chat.*: true
      guilds.techtree.*: true
      guilds.blueprint.*: true

  guilds.town.*:
    description: All town-related permissions
    children:
      guilds.town.create: true
      guilds.town.delete: true
      guilds.town.join: true
      guilds.town.leave: true
      guilds.town.claim: true
      guilds.town.unclaim: true
      guilds.town.spawn: true
      guilds.town.set: true
      guilds.town.kick: true
      guilds.town.invite: true
      guilds.town.mayor: true
      guilds.town.assistant: true
      guilds.town.specialize: true

  guilds.resident.*:
    description: All resident-related permissions
    children:
      guilds.resident.info: true
      guilds.resident.list: true
      guilds.resident.friend: true
      guilds.resident.town: true

  guilds.plot.*:
    description: All plot-related permissions
    children:
      guilds.plot.claim: true
      guilds.plot.unclaim: true
      guilds.plot.info: true
      guilds.plot.set: true
      guilds.plot.perms: true
      guilds.plot.toggle: true

  guilds.broadcast:
    description: Permission to use town broadcast commands
    default: true

  guilds.broadcast.*:
    description: All broadcast permissions
    children:
      guilds.broadcast.create: true
      guilds.broadcast.read: true
      guilds.broadcast.manage: true

  guilds.general.*:
    description: General guilds permissions
    children:
      guilds.general.info: true
      guilds.general.chat: true
      guilds.general.top: true
      guilds.general.prices: true
      guilds.general.time: true
      guilds.general.universe: true
      guilds.general.version: true

  guilds.chat.town:
    description: Permission to use town chat
    default: true

  guilds.chat.spy:
    description: Permission to spy on town chat
    default: op

  guilds.techtree.view:
    description: Permission to view the tech tree
    default: true

  guilds.techtree.unlock:
    description: Permission to unlock tech nodes
    default: true

  guilds.commands.nation:
    description: Permission to use nation commands
    default: true

  guilds.nation.*:
    description: All nation permissions
    children:
      guilds.nation.create: true
      guilds.nation.invite: true
      guilds.nation.join: true
      guilds.nation.leave: true
      guilds.nation.kick: true
      guilds.nation.ally: true
      guilds.nation.enemy: true
      guilds.nation.set: true

  guilds.commands.blueprint:
    description: Permission to use blueprint commands
    default: true

  guilds.map:
    description: Permission to use guilds map commands
    default: true

  guilds.level:
    description: Permission to use town level commands
    default: true

  guilds.admin.perm:
    description: Permission to use permission debugging commands
    default: op

  guilds.admin.*:
    description: All admin permissions
    children:
      guilds.admin.reload: true
      guilds.admin.backup: true
      guilds.admin.purge: true
      guilds.admin.town: true
      guilds.admin.resident: true
      guilds.admin.plot: true
      guilds.admin.plottype: true
      guilds.admin.unclaim: true
      guilds.admin.claim: true
      guilds.admin.bypass: true
      guilds.admin.nation: true
      guilds.admin.blueprint: true
      guilds.admin.quest: true

  guilds.admin.plottype:
    description: Permission to use plot type management commands
    default: op
