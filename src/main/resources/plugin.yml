name: AzothTerritory
version: ${version}
main: com.azoth.territory.AzothTerritoryPlugin
api-version: '1.21'
description: ${description}
author: Azoth
website: https://github.com/azoth/azoth-territory
load: POSTWORLD
softdepend: [Vault, WorldEdit, WorldGuard, triumph-gui]
commands:
  territory:
    description: Inspect territory and zone at a location
    usage: /territory [lookup|list|reload]
    permission: azoth.territory.admin
    aliases: [azterritory, at]
# Guilds/Towny commands are registered dynamically via Paper Brigadier lifecycle
permissions:
  azoth.territory.admin:
    description: Administer and inspect territories
    default: op

  towny.*:
    description: All Towny/Guilds permissions
    children:
      towny.town.*: true
      towny.resident.*: true
      towny.plot.*: true
      towny.general.*: true
      towny.map: true
      towny.admin.*: true
      towny.nation.*: true
      towny.chat.*: true
      towny.techtree.*: true
      towny.blueprint.*: true

  towny.town.*:
    description: All town-related permissions
    children:
      towny.town.create: true
      towny.town.delete: true
      towny.town.join: true
      towny.town.leave: true
      towny.town.claim: true
      towny.town.unclaim: true
      towny.town.spawn: true
      towny.town.set: true
      towny.town.kick: true
      towny.town.invite: true
      towny.town.mayor: true
      towny.town.assistant: true
      towny.town.specialize: true

  towny.resident.*:
    description: All resident-related permissions
    children:
      towny.resident.info: true
      towny.resident.list: true
      towny.resident.friend: true
      towny.resident.town: true

  towny.plot.*:
    description: All plot-related permissions
    children:
      towny.plot.claim: true
      towny.plot.unclaim: true
      towny.plot.info: true
      towny.plot.set: true
      towny.plot.perms: true
      towny.plot.toggle: true

  towny.broadcast:
    description: Permission to use town broadcast commands
    default: true

  towny.broadcast.*:
    description: All broadcast permissions
    children:
      towny.broadcast.create: true
      towny.broadcast.read: true
      towny.broadcast.manage: true

  towny.general.*:
    description: General towny permissions
    children:
      towny.general.info: true
      towny.general.chat: true
      towny.general.top: true
      towny.general.prices: true
      towny.general.time: true
      towny.general.universe: true
      towny.general.version: true

  towny.chat.town:
    description: Permission to use town chat
    default: true

  towny.chat.spy:
    description: Permission to spy on town chat
    default: op

  towny.techtree.view:
    description: Permission to view the tech tree
    default: true

  towny.techtree.unlock:
    description: Permission to unlock tech nodes
    default: true

  towny.commands.nation:
    description: Permission to use nation commands
    default: true

  towny.nation.*:
    description: All nation permissions
    children:
      towny.nation.create: true
      towny.nation.invite: true
      towny.nation.join: true
      towny.nation.leave: true
      towny.nation.kick: true
      towny.nation.ally: true
      towny.nation.enemy: true
      towny.nation.set: true

  towny.commands.blueprint:
    description: Permission to use blueprint commands
    default: true

  towny.map:
    description: Permission to use towny map commands
    default: true

  towny.level:
    description: Permission to use town level commands
    default: true

  towny.admin.perm:
    description: Permission to use permission debugging commands
    default: op

  towny.admin.*:
    description: All admin permissions
    children:
      towny.admin.reload: true
      towny.admin.backup: true
      towny.admin.purge: true
      towny.admin.town: true
      towny.admin.resident: true
      towny.admin.plot: true
      towny.admin.plottype: true
      towny.admin.unclaim: true
      towny.admin.claim: true
      towny.admin.bypass: true
      towny.admin.nation: true
      towny.admin.blueprint: true
      towny.admin.quest: true

  towny.admin.plottype:
    description: Permission to use plot type management commands
    default: op
